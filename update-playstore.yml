name: Actualizar datos Google Play
on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Actualizar nombres, iconos y descripciones
        run: python tools/update_playstore.py
      - name: Publicar cambios si Google Play cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/playstore.json
          git diff --cached --quiet || (git commit -m "Actualizar datos desde Google Play" && git push)
